<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenZ T-Shirts | Freedom Sale</title>
    <style>
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
        }
        header {
            background-color: #1f1f1f;
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .hero {
            padding: 50px 20px;
        }
        .hero h1 {
            font-size: 36px;
            color: #2ec4b6;
            margin-bottom: 10px;
        }
        .sale-banner {
            background: linear-gradient(90deg, #075e54, #128c7e);
            color: #ffffff;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            margin: 20px 0;
            border-radius: 8px;
            display: inline-block;
        }
        .price {
            font-size: 22px;
            margin-top: 10px;
        }
        .old-price {
            text-decoration: line-through;
            color: #ff4d4d;
            margin-right: 10px;
        }
        .new-price {
            color: #25d366;
            font-size: 28px;
            font-weight: bold;
        }
        .btn {
            background-color: #25d366;
            color: #000;
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            text-decoration: none;
            display: inline-block;
        }
    </style>
</head>
<body>

    <header>GEN Z CLOTHING</header>

    <div class="hero">
        <h1>Oversized & Drop Shoulder T-Shirts</h1>
        <p>Premium Quality Graphic Tees for Gen Z</p>
        
        <div class="sale-banner">
            🇵🇰 AZADI SALE IS LIVE! 🇵🇰
        </div>

        <div class="price">
            <span class="old-price">Rs. 1,599</span>
            <span class="new-price">Rs. 1,099</span>
        </div>

        <br>
        <a href="#" class="btn">Order Now on WhatsApp</a>
    </div>

</body>
</html>
